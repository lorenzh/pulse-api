name: Bench

# Nightly A/B comparison of CPU time and memory per service. See bench/README.md.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      a:
        description: "Ref of api for side A (default: baseline)"
        required: false
        type: string
      b:
        description: "Ref of api for side B (default: main)"
        required: false
        type: string
      others:
        description: "Ref that pins every other repository on both sides (default: tags and main)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Run the comparison
        env:
          INPUT_A: ${{ inputs.a }}
          INPUT_B: ${{ inputs.b }}
          INPUT_OTHERS: ${{ inputs.others }}
        run: |
          args=()
          if [ -n "$INPUT_A" ]; then args+=(--a "$INPUT_A"); fi
          if [ -n "$INPUT_B" ]; then args+=(--b "$INPUT_B"); fi
          if [ -n "$INPUT_OTHERS" ]; then args+=(--others-ref "$INPUT_OTHERS"); fi
          bun bench/run.ts "${args[@]}" --out bench-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-out
          path: bench-out/
          if-no-files-found: ignore
