name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: lorenzh/pulse-config/.github/workflows/check.yml@a3432e0451bb24397e77e48a5ee2e9d46913bd05

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag pulse-api:local .
      - run: cp .env.example .env && docker compose config --quiet
      - name: Image holds no test files
        run: |
          found=$(docker run --rm --entrypoint sh pulse-api:local -c "find /app -type f \( -name '*.test.ts' -o -name '*.spec.ts' \) -not -path '*/node_modules/*'")
          if [ -n "$found" ]; then echo "$found"; exit 1; fi
      - name: Status port override
        run: PULSE_STATUS_PORT=8090 docker compose config | grep 'published: "8090"'
