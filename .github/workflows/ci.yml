name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: lorenzh/pulse-config/.github/workflows/check.yml@51e95b0eb463b27a196a33b428607bd92443e4f0

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag pulse-api:local .
      - run: cp .env.example .env && docker compose config --quiet
      - name: Image holds no test files
        run: |
          found=$(docker run --rm --entrypoint sh pulse-api:local -c "find /app -type f \( -name '*.test.ts' -o -name '*.spec.ts' \) -not -path '*/node_modules/*'")
          if [ -n "$found" ]; then echo "$found"; exit 1; fi
      - name: Status port override
        run: |
          PULSE_STATUS_PORT=8090 docker compose config | grep 'published: "8090"'

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/compose-e2e.sh
      - name: Remove leftover containers and volumes
        if: always()
        run: docker compose --project-name pulse-e2e --profile demo down -v --remove-orphans
