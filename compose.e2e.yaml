# E2E fixtures, merged after compose.yaml by scripts/compose-e2e.sh only:
# COMPOSE_FILE=compose.yaml:compose.e2e.yaml
services:
  api:
    environment:
      # Enables the write routes of manual incidents; the token is a throwaway of this stack.
      PULSE_API_ADMIN_TOKENS_FILE: /run/pulse/admin-tokens.json
      # The admin routes write the checks file, so it comes from a writable directory mount
      # (a copy made by scripts/compose-e2e.sh). The regular read-only mount below stays, for the
      # test that a read-only file answers 503.
      PULSE_CHECKS_FILE: /config-rw/checks.json
      PULSE_CHECKS_RELOAD_INTERVAL_MS: "2000"
    configs:
      - source: admin-tokens
        target: /run/pulse/admin-tokens.json
    volumes:
      # Same target path as in compose.yaml, so this replaces the regular checks file.
      - ./compose/e2e/checks.json:/config/checks.json:ro
      - ./compose/e2e/rw:/config-rw

  status:
    environment:
      # Turns on /feed.atom.
      PULSE_STATUS_PUBLIC_URL: http://status.e2e.invalid

  notify:
    volumes:
      # Same target path as in compose.yaml: this replaces the regular channels with
      # component-routed ones for the manual incident scenario.
      - ./compose/e2e/notify.json:/config/notify.json:ro

  probe:
    environment:
      # Resolved by the probe for the header {"env": "PULSE_HEADER_SVC_TOKEN"} of the check e2e-post.
      # The env value is the whole header value, so it carries the "Bearer " scheme.
      PULSE_HEADER_SVC_TOKEN: Bearer ${E2E_SVC_TOKEN:-e2e-svc-token-sentinel}
    depends_on:
      e2e-target:
        condition: service_started

  # Target of the check e2e-post in compose/e2e/checks.json: see compose/e2e/target.mjs.
  e2e-target:
    image: oven/bun:1.4.0-alpine@sha256:07235578f79ef8c6f97d94aee7938e76f5cdba5f21ae5dbfdd3d3d38058437eb
    command: ["bun", "/e2e/target.mjs"]
    environment:
      PULSE_HEADER_SVC_TOKEN: ${E2E_SVC_TOKEN:-e2e-svc-token-sentinel}
    volumes:
      - ./compose/e2e/target.mjs:/e2e/target.mjs:ro

configs:
  admin-tokens:
    content: |
      {"tokens": [{"name": "e2e", "token": "${E2E_ADMIN_TOKEN:-e2e-admin-token-sentinel-0123}"}]}
