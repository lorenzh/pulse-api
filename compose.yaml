# Needs Docker Compose >= 2.23 (configs with `content:`).
# Setup: cp .env.example .env
name: pulse

services:
  api:
    build: .
    image: pulse-api:local
    environment:
      PULSE_CHECKS_FILE: /config/checks.json
      PULSE_TOKENS_FILE: /run/pulse/tokens.json
    configs:
      - source: tokens
        target: /run/pulse/tokens.json
    volumes:
      - api-data:/data
      - ./compose/checks.json:/config/checks.json:ro
    ports:
      - "127.0.0.1:${PULSE_API_PORT:-3000}:3000"

  probe:
    build: https://github.com/lorenzh/pulse-probe.git#main
    image: pulse-probe:local
    environment:
      PULSE_API_URL: http://api:3000
      PULSE_LOCATION: ${PULSE_LOCATION:-default}
      PULSE_PROBE_TOKEN: ${PULSE_PROBE_TOKEN:?copy .env.example to .env}
    depends_on:
      api:
        condition: service_healthy
      status:
        condition: service_healthy

  status:
    build: https://github.com/lorenzh/pulse-status.git#main
    image: pulse-status:local
    environment:
      PULSE_API_URL: http://api:3000
    ports:
      - "${PULSE_STATUS_PORT:-8080}:8080"
    healthcheck:
      interval: 5s
    depends_on:
      api:
        condition: service_healthy

  notify:
    build: https://github.com/lorenzh/pulse-notify.git#main
    image: pulse-notify:local
    environment:
      PULSE_API_URL: http://api:3000
      PULSE_NOTIFY_CONFIG: /config/notify.json
    volumes:
      - notify-data:/data
      - ./compose/notify.json:/config/notify.json:ro
    depends_on:
      api:
        condition: service_healthy

configs:
  tokens:
    content: |
      {"tokens": [{"location": "${PULSE_LOCATION:-default}", "token": "${PULSE_PROBE_TOKEN:?copy .env.example to .env}"}]}

volumes:
  api-data:
  notify-data:
